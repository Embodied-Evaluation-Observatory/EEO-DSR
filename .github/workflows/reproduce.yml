name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install jsonschema
      - run: python3 tools/run_all_checks.py
      - run: python3 tools/cosine_threshold_smoke.py --w 0.95 > /dev/null
